<script>
  // Apply the stored (or system) theme before the first paint, so a dark-mode
  // reader never sees a white flash while the app loads. prefs.js, posts/post.js
  // and collect.js read the same key and keep <html data-theme> in step.
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('yps-hp-prefs') || '{}') || {};
      var t = (p.theme === 'dark' || p.theme === 'light') ? p.theme
            : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fafaf7');
    } catch (e) {}
  })();
</script>
