     then: sips -z 32 32 assets/icon-180.png --out assets/icon-32.png

</head><body>

  <text x="4" y="56" font-family="Times New Roman, Georgia, serif" font-style="italic" font-size="58" fill="#0a0a0a">Y</text>
  <circle cx="50" cy="16" r="9" fill="#16a34a"/>
</svg>
</body></html>
