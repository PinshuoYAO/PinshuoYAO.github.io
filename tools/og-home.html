<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fafaf7;
    color: #0a0a0a;
    font-family: "Source Serif 4", Georgia, serif;
    position: relative;
    overflow: hidden;
  }
  /* the same faint grid the site uses */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(10,10,10,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,10,10,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .wrap {
    position: relative; height: 100%;
    padding: 74px 80px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 60px; align-items: center;
  }
  .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 16px; letter-spacing: .16em; text-transform: uppercase;
    color: #6b6b6b; display: flex; align-items: center; gap: 14px;
    margin-bottom: 30px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
  h1 { font-size: 104px; line-height: .9; letter-spacing: -.035em; font-weight: 400; }
  h1 .ital { font-style: italic; color: #16a34a; }
  .cn {
    font-family: "Noto Serif JP", serif;
    font-size: 26px; letter-spacing: .36em; color: #6b6b6b;
    margin: 22px 0 26px;
  }
  p {
    font-size: 25px; line-height: 1.5; max-width: 22ch; color: #0a0a0a;
  }
  .key {
    background: linear-gradient(transparent 64%, rgba(22,163,74,.34) 64%);
    padding: 0 2px;
  }
  figure {
    width: 300px; height: 300px;
    border: 1px solid rgba(10,10,10,.14);
    padding: 9px; background: #fff;
  }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rule {
    position: absolute; left: 80px; right: 80px; bottom: 52px;
    border-top: 1px solid rgba(10,10,10,.14);
    padding-top: 16px;
    font-family: "JetBrains Mono", monospace;
    font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
    color: #6b6b6b; display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="meta"><span class="dot"></span><span>UTOKYO · Institute of Industrial Science</span></div>
      <h1>YAO<br><span class="ital">Pinshuo</span></h1>
      <div class="cn">姚 品 碩</div>
      <p><span class="key">AI</span> protein design × <span class="key">lipid</span> biophysics</p>
    </div>
    <figure><img src="../assets/portrait.jpg" alt=""></figure>
  </div>
  <div class="rule"><span>pinshuoyao.github.io</span><span>PhD candidate · Tsuboyama Lab</span></div>
</body>
</html>
