<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px}
body{background:#fafaf7;color:#0a0a0a;font-family:"Source Serif 4",Georgia,serif;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(10,10,10,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(10,10,10,.04) 1px,transparent 1px);
  background-size:40px 40px}
.wrap{position:relative;height:100%;padding:60px 70px 54px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
.kicker{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#6b6b6b;display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:34px;height:1px;background:#0a0a0a}
h1{font-size:52px;line-height:1.08;letter-spacing:-.02em;font-weight:400;font-style:italic;max-width:15ch}
h1 .key{background:linear-gradient(transparent 64%,rgba(22,163,74,.34) 64%);padding:0 3px;font-style:normal}
.row{display:grid;grid-template-columns:1fr auto;gap:44px;align-items:center;min-height:0}
/* the four styles as a 2x2 of square plates, which is what the post is about */
.grid{display:grid;grid-template-columns:repeat(2,168px);grid-template-rows:repeat(2,168px);gap:10px;justify-self:end}
.grid div{border:1px solid rgba(10,10,10,.14);background:#fff;padding:5px}
.grid img{width:100%;height:100%;display:block;object-fit:contain}
.rule{border-top:1px solid rgba(10,10,10,.14);padding-top:15px;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6b6b6b;display:flex;justify-content:space-between}
.rule .who{color:#0a0a0a}
</style></head><body>
<div class="wrap">
  <div class="kicker">Blog · Tool note</div>
  <div class="row">
    <h1>Protein figures without opening <span class="key">PyMOL</span></h1>
    <div class="grid">
      <div><img src="/tmp/py2dmol_tile0.png" alt=""></div>
      <div><img src="/tmp/py2dmol_tile1.png" alt=""></div>
      <div><img src="/tmp/py2dmol_tile2.png" alt=""></div>
      <div><img src="/tmp/py2dmol_tile3.png" alt=""></div>
    </div>
  </div>
  <div class="rule"><span class="who">YAO Pinshuo · 姚品碩</span><span>pinshuoyao.github.io</span></div>
</div>
</body></html>
